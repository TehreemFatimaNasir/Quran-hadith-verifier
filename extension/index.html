<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran & Hadith Verifier</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;500&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <style>

        :root {
            --bg-1: #dbe5f1;  --bg-2: #f5f8fc;
            --card: #ffffff;  --card-soft: #f3f6fb;
            --ink: #1d2e47;   --ink-soft: #62758f;
            --line: #d3deec;
            --primary: #4b6f98;  --primary-deep: #2f4d73;  --primary-soft: #e7eef7;
            --grad-a: #2f4d73;   --grad-b: #5d82ad;
            --gold: #b48bc2;     --gold-ink: #6d3f7c;  --gold-b: #9a65a8;
            --shadow-rgb: 47, 77, 115;
            --scan: #bed1e3;
            --danger-bg: #fdeeef; --danger-ink: #a33344;
            --warn-bg: #fbf1f7;   --warn-ink: #7a3f66;
            --arabic: "Amiri", "Scheherazade New", "Noto Naskh Arabic", "Traditional Arabic", serif;
            --urdu: "Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", "Amiri", serif;
            --sans: "Poppins", "Segoe UI", Roboto, Arial, sans-serif;
        }

        :root[data-theme="dark"] {
            --bg-1: #0a1320;  --bg-2: #132238;
            --card: #172b45;  --card-soft: #12233a;
            --ink: #e8eff8;   --ink-soft: #9db2cc;
            --line: #2a4262;
            --primary: #93aeca;  --primary-deep: #bcd0e6;  --primary-soft: #1d3454;
            --gold: #c9a0d6;
            --shadow-rgb: 0, 0, 0;
            --danger-bg: #3b1f26; --danger-ink: #ffb4be;
            --warn-bg: #33243a;   --warn-ink: #e9bfdc;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            width: 400px;
            min-height: 460px;
            font-family: var(--sans);
            color: var(--ink);
            background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 280px);
            transition: background 0.3s ease, color 0.3s ease;
        }

        button { font: inherit; cursor: pointer; }
        [hidden] { display: none !important; }

        .hero {
            padding: 30px 22px 32px;
            text-align: center;
            color: #fff;
            background:
                radial-gradient(120% 140% at 85% -20%, rgba(190, 209, 227, 0.35) 0%, transparent 55%),
                linear-gradient(160deg, #27425f 0%, #3f6189 52%, #5f84ad 100%);
            border-radius: 0 0 28px 28px;
            box-shadow: 0 10px 26px rgba(var(--shadow-rgb), 0.25);
        }

        .hero h1 {
            margin: 0 0 10px;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }


        .hero p {
            max-width: 300px;
            margin: 0 auto;
            font-size: 12px;
            line-height: 1.65;
            color: rgba(255, 255, 255, 0.8);
        }

        main { padding: 18px 16px 22px; }

        .drop {
            padding: 18px 16px;
            text-align: center;
            border: 1.5px dashed var(--gold);
            border-radius: 20px;
            background: var(--card);
            box-shadow: 0 10px 28px rgba(var(--shadow-rgb), 0.1);
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .drop.dragging { background: var(--primary-soft); border-style: solid; }

        .drop-icon {
            width: 48px; height: 48px;
            margin: 0 auto 10px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: var(--primary);
            background: var(--primary-soft);
            border: 1px solid var(--line);
        }

        .drop-title { margin: 0 0 2px; font-size: 14px; font-weight: 600; }
        .drop-sub { margin: 0 0 14px; font-size: 12px; color: var(--ink-soft); }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            width: 100%;
            padding: 11px 8px;
            border: 1px solid transparent;
            border-radius: 13px;
            font-size: 13px;
            font-weight: 500;
            transition: box-shadow 0.2s ease, background 0.2s ease, transform 0.1s ease;
        }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.55; cursor: not-allowed; }

        .btn-primary {
            color: #fff;
            background: linear-gradient(135deg, var(--grad-a), var(--grad-b));
            box-shadow: 0 6px 14px rgba(var(--shadow-rgb), 0.28);
        }
        .btn-primary:hover:not(:disabled) { box-shadow: 0 8px 18px rgba(var(--shadow-rgb), 0.4); }

        .btn-soft {
            color: var(--primary-deep);
            background: var(--primary-soft);
            border-color: var(--line);
        }
        .btn-soft:hover:not(:disabled) { background: var(--line); }
        .btn-wide { margin-top: 12px; }

        .stage {
            position: relative;
            margin-top: 16px;
            overflow: hidden;
            border-radius: 20px;
            background: #0b1420;
            border: 1px solid var(--gold);
            box-shadow: 0 10px 28px rgba(var(--shadow-rgb), 0.2);
        }

        .stage img, .stage video { display: block; width: 100%; max-height: 250px; object-fit: contain; }

        .corner {
            position: absolute;
            width: 20px; height: 20px;
            border: 2px solid var(--scan);
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .corner.tl { top: 10px; left: 10px; border-right: 0; border-bottom: 0; }
        .corner.tr { top: 10px; right: 10px; border-left: 0; border-bottom: 0; }
        .corner.bl { bottom: 10px; left: 10px; border-right: 0; border-top: 0; }
        .corner.br { bottom: 10px; right: 10px; border-left: 0; border-top: 0; }
        .stage.scanning .corner { opacity: 0.95; }

        .scan-line {
            position: absolute;
            left: 0; right: 0; top: 0;
            height: 2px;
            opacity: 0;
            background: linear-gradient(90deg, transparent, var(--scan), transparent);
            box-shadow: 0 0 14px 3px rgba(147, 174, 202, 0.6);
            z-index: 2;
        }
        .stage.scanning .scan-line { opacity: 1; animation: sweep 3s ease-in-out infinite; }

        .steps {
            margin: 16px 0 0;
            padding: 12px 16px;
            list-style: none;
            border-radius: 16px;
            background: var(--card);
            border: 1px solid var(--line);
        }

        .steps li {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 6px 0;
            font-size: 13px;
            color: var(--ink-soft);
            transition: color 0.3s ease;
        }

        .steps .dot {
            flex: none;
            width: 20px; height: 20px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            border: 2px solid var(--line);
            font-size: 11px;
            color: transparent;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .steps li.active { color: var(--ink); font-weight: 500; }
        .steps li.active .dot { border-color: var(--gold); border-top-color: transparent; animation: spin 1s linear infinite; }
        .steps li.done { color: var(--primary-deep); }
        .steps li.done .dot { background: var(--primary); border-color: var(--primary); color: #fff; }

        .status {
            margin: 16px 0 0;
            padding: 12px 14px;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.6;
            background: var(--primary-soft);
            color: var(--primary-deep);
            border: 1px solid var(--line);
        }
        .status.error { background: var(--danger-bg); color: var(--danger-ink); border-color: transparent; }
        .status.warning { background: var(--warn-bg); color: var(--warn-ink); border-color: transparent; }

        .result-card {
            position: relative;
            margin-top: 18px;
            overflow: hidden;
            border-radius: 22px;
            background: var(--card);
            border: 1px solid var(--gold);
            box-shadow: 0 14px 34px rgba(var(--shadow-rgb), 0.16);
            animation: rise 0.5s ease both;
        }
        .result-card + .result-card { margin-top: 16px; }

        .result-top {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 14px 16px;
            color: #fff;
            background: linear-gradient(135deg, var(--grad-a), var(--grad-b));
        }
        .result-top.hadith { background: linear-gradient(135deg, var(--gold-ink), var(--gold-b)); }

        .check { flex: none; width: 30px; height: 30px; }
        .check circle { fill: rgba(255, 255, 255, 0.14); stroke: #fff; stroke-width: 2; stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 0.7s 0.1s ease forwards; }
        .check path { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw 0.5s 0.6s ease forwards; }

        .result-top .label { flex: 1; min-width: 0; }
        .result-top .label small { display: block; font-size: 11px; letter-spacing: 0.4px; text-transform: uppercase; opacity: 0.85; }
        .result-top .label strong { display: block; font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }

        .badge {
            flex: none;
            min-width: 42px; height: 42px;
            padding: 0 8px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            font-size: 14px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.12);
            border: 1.5px solid rgba(255, 255, 255, 0.75);
        }
        .badge.wide { border-radius: 21px; }

        .result-body { padding: 16px; }

        .arabic-wrap {
            position: relative;
            padding: 18px 14px 16px;
            border-radius: 16px;
            background: var(--card-soft);
            border: 1px solid var(--line);
        }
        .arabic-wrap::before, .arabic-wrap::after {
            content: "";
            position: absolute;
            left: 16px; right: 16px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }
        .arabic-wrap::before { top: 0; }
        .arabic-wrap::after { bottom: 0; }

        .arabic {
            margin: 0;
            font-family: var(--arabic);
            font-size: 25px;
            line-height: 2.1;
            text-align: center;
            direction: rtl;
            color: var(--ink);
            overflow-wrap: anywhere;
        }
        .arabic .ornament { color: var(--gold); font-size: 28px; }
        .arabic.clamped { max-height: 11em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }

        .tools { display: flex; justify-content: center; gap: 8px; margin-top: 12px; }

        .chip-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border-radius: 20px;
            border: 1px solid var(--gold);
            background: var(--card);
            color: var(--primary-deep);
            font-size: 12px;
            font-weight: 500;
            transition: background 0.2s ease;
        }
        .chip-btn:hover { background: var(--primary-soft); }
        .chip-btn.playing { background: var(--primary); color: #fff; border-color: var(--primary); }

        .tr-title { margin: 20px 0 10px; font-size: 13px; font-weight: 600; color: var(--primary-deep); display: flex; align-items: center; gap: 10px; }
        .tr-title::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--gold), transparent); }

        .segmented {
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 4px;
            border-radius: 14px;
            background: var(--primary-soft);
            border: 1px solid var(--line);
        }

        .segmented .thumb {
            position: absolute;
            top: 4px; bottom: 4px; left: 4px;
            width: calc(50% - 4px);
            border-radius: 10px;
            background: linear-gradient(135deg, var(--grad-a), var(--grad-b));
            box-shadow: 0 4px 10px rgba(var(--shadow-rgb), 0.3);
            transition: transform 0.28s ease;
        }
        .segmented[data-active="en"] .thumb { transform: translateX(100%); }

        .segmented button {
            position: relative;
            z-index: 1;
            padding: 9px 6px;
            border: 0;
            background: transparent;
            color: var(--primary-deep);
            font-size: 14px;
            font-weight: 500;
            transition: color 0.25s ease;
        }
        .segmented button.active { color: #fff; }

        .tr-output {
            margin-top: 12px;
            padding: 14px 16px;
            max-height: 230px;
            overflow-y: auto;
            border-radius: 14px;
            background: var(--card-soft);
            border: 1px solid var(--line);
            font-size: 14.5px;
            line-height: 1.85;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            animation: fade 0.3s ease both;
        }
        .tr-output.ur { direction: rtl; text-align: right; font-family: var(--urdu); font-size: 17px; line-height: 2.5; }
        .tr-output.en { direction: ltr; text-align: left; }
        .tr-output.missing { color: var(--ink-soft); font-style: italic; }

        .toast {
            position: fixed;
            left: 50%; bottom: 14px;
            transform: translate(-50%, 16px);
            max-width: 360px;
            padding: 9px 15px;
            border-radius: 20px;
            font-size: 12px;
            color: #fff;
            background: rgba(14, 26, 44, 0.94);
            border: 1px solid var(--gold);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 10;
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }

        @keyframes sweep { 0%, 100% { top: 0; } 50% { top: calc(100% - 2px); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
        @keyframes draw { to { stroke-dashoffset: 0; } }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>

<body>
    <header class="hero">

        <h1>Quran &amp; Hadith Verifier</h1>
        <p>Upload or capture an image of Arabic text to find its reference, with Urdu &amp; English translation.</p>
    </header>

    <main>
        <section id="drop" class="drop" aria-label="Choose an image">
            <div class="drop-icon" aria-hidden="true">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/></svg>
            </div>
            <p class="drop-title">Drop an image here</p>
            <p class="drop-sub">or choose one of the options below</p>

            <div class="controls">
                <button id="cameraBtn" class="btn btn-primary" type="button">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                    Open Camera
                </button>
                <button id="uploadBtn" class="btn btn-soft" type="button">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                    Upload Image
                </button>
            </div>
        </section>

        <input id="imageInput" type="file" accept="image/*" hidden>

        <div id="stage" class="stage" hidden>
            <video id="camera" autoplay playsinline muted hidden></video>
            <img id="preview" alt="Selected image preview" hidden>
            <span class="corner tl"></span><span class="corner tr"></span>
            <span class="corner bl"></span><span class="corner br"></span>
            <div class="scan-line"></div>
        </div>

        <button id="captureBtn" class="btn btn-primary btn-wide" type="button" hidden>Capture &amp; Verify</button>
        <button id="resetBtn" class="btn btn-soft btn-wide" type="button" hidden>Start over</button>

        <ol id="steps" class="steps" hidden>
            <li data-step="0"><span class="dot">✓</span>Reading the Arabic text</li>
            <li data-step="1"><span class="dot">✓</span>Searching the Quran</li>
            <li data-step="2"><span class="dot">✓</span>Searching hadith collections</li>
        </ol>

        <div id="status" class="status" role="status" aria-live="polite" hidden></div>

        <section id="results" aria-label="Verification results"></section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="script.js"></script>
</body>
</html>
